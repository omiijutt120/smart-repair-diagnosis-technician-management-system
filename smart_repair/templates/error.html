{% extends 'base.html' %}{% from 'macros.html' import icon %}
{% block content %}<section class="panel error-panel"><span class="error-code">{{ code }}</span><h1>{{ title }}</h1><p>{{ message }}</p><div class="button-group"><button class="btn" data-back>← Go back</button><a class="btn primary" href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.landing') }}">Return to {{ 'workspace' if current_user.is_authenticated else 'home' }} {{ icon('arrow',17) }}</a></div></section>{% endblock %}
