{% extends 'base.html' %}{% from 'macros.html' import field,icon %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">SMART REPAIR WORKSPACE</div><h1>{{ title }}</h1><p>{{ subtitle|default('Keep your information up to date.') }}</p></div></div><section class="panel form-panel"><form method="post" class="stack-form" enctype="multipart/form-data">{{ form.hidden_tag() }}{% for f in form %}{{ field(f) }}{% endfor %}<div class="form-actions"><a class="btn" href="{{ url_for('main.dashboard') }}">Back to overview</a><button class="btn primary">{{ submit|default('Save changes') }}{{ icon('check',17) }}</button></div></form></section>{% endblock %}
